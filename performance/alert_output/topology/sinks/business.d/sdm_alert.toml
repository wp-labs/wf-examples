version = "1.0"

[sink_group]
name = "sdm_alert_out"
# 本机场景调优结果：2 个消费者已达到吞吐平台，继续增加没有稳定收益。
parallel = 2
windows = ["sdm_alert"]
wf_meta_disable = [
    "__wfu_id",
    "__wfu_rule_name",
    "__wfu_score",
    "__wfu_entity_type",
    "__wfu_entity_id",
    "__wfu_origin",
    "__wfu_close_reason",
    "__wfu_fired_at",
    "__wfu_emit_time",
    "__wfu_summary",
]

[[sink_group.sinks]]
connect = "file_json_sink"
name = "sdm_alert_file"

[sink_group.sinks.params]
base = "data/out_dat"
file = "sdm_alert.json"
sync = false

# Kafka output is intentionally disabled for the local benchmark.
