# 性能墙定位（perf-diag 墙梯）配置 —— diag.sh 专用
#
# 与 conf/perf-diag.toml 的分工：
#   conf/perf-diag.toml       无档（空 stages）→ bench.sh 用：只注册 __wf_sentinel
#                             哨兵窗口拿精确 EPS 口径，门控全 false，性能零影响。
#   conf/perf-diag-wall.toml  四档墙梯 → diag.sh 用：逐段切除定位瓶颈在哪一段。
#
# 墙梯是**叠加式**（从管线尾部向前切，见 wp-reactor/docs/PERF_BISECTION_METHOD.md §2）：
#   recv   = 注入 + TCP 接收（cut_recv: 非哨兵帧只读帧头 tag 即丢, 不解码 body）
#            → 增量（decode − recv）= 解码成本（validate_utf8 字节率墙）
#   decode = recv + 解码（cut_append: 窗口 append 前即丢；哨兵流豁免）
#            → 增量（floor − decode）= 窗口 append + fanout 投递成本
#   floor  = decode + 窗口 append + fanout（净管道，规则/输出全切）
#   rules  = floor + 规则求值        → 增量 = 规则墙
#   full   = rules + 输出链（emit 构建 + 通道投递 + 序列化 + sink 写）
#            → 增量 = 输出链（2026-08-26 内存定位：q13 的 12.5GB 全在这段）
#
# recv/decode 档（2026-08-25 新增）:
#   recv   在 source 解码前生效（frame_tag 读帧头, 非哨兵 body 即丢）——隔离
#         单连接 TCP 字节率（decode 侧 validate_utf8 ~2.3GB/s 单线程墙）;
#   decode 在 push_decoded_batch 入口生效（解码后即丢, 不占 parse 槽位）。
# 各档均豁免 __wf_sentinel 流——测量协议（档位切换 + EPS 计算）必须活着。
#
# ⚠ 曾有 emit 档（cut_serialize: AlertBatch 到 sink 即丢）——2026-08-26 移除：
#   本 bench 的 sink 是 blackhole（本来就丢弃），full − emit ≈ 0，白跑一轮且
#   误导（让人以为序列化成本≈0）。若改用真实 sink（file_json_sink 等）再恢复。
#   另外，输出链内部如需再细分（alert 构建 vs 其余），用引擎侧临时开关
#   WF_DIAG_CUT_ALERT=1（只切 AlertColumnBuilder 装载，保留 pipe/join 消费）。
#
# 档间切换由哨兵（漂流瓶）驱动，单 daemon 不重启；启动即应用 stages[0]（recv）。
# 机制见 wp-reactor/docs/design/perf-diag-mode-design.md，用法见
# wp-reactor/docs/user-guide/perf-diag.md。
#
# ⚠ rules 字段留空 = 保持 daemon 当前规则文件（diag.sh 已把 runtime.rules 指向
#   models/queries/<qN>.wfl）。不要在此写死查询路径，否则与 diag.sh 的查询参数冲突。

# 内存采样开关（diag.sh 读取；daemon 侧忽略此未知字段）：
#   mem_sample = true（默认，缺失即开）→ diag.sh 启动 footprint 采样器，
#       墙表/内存墙表输出每档 DIRTY_peak——dirty 是物理真持有（RSS 含页表
#       保留，波动大；q13 定位后内存判据用 dirty）。
#   mem_sample = false → 关闭（省 footprint spawn ~50% 核开销；非内存验证用）。
mem_sample = true

[[stages]]
name = "recv"
cut_rules = false
cut_output = false
cut_append = false
cut_recv = true
rules = ""

[[stages]]
name = "decode"
cut_rules = false
cut_output = false
cut_append = true
cut_recv = false
rules = ""

[[stages]]
name = "floor"
cut_rules = true
cut_output = true
cut_append = false
cut_recv = false
rules = ""

[[stages]]
name = "rules"
cut_rules = false
cut_output = true
cut_append = false
cut_recv = false
rules = ""

[[stages]]
name = "full"
cut_rules = false
cut_output = false
cut_append = false
cut_recv = false
cut_sink_write = false
rules = ""
