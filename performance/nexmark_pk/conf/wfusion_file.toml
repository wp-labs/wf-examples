# 文件源 batch 配置 —— verify_file.sh 的文件源正确性验证（batch 模式，跑完即退）
#
# 与 daemon 配置（conf/wfusion.toml）的区别：
# - mode = "batch" + [[sources]] type=file：直读预编码帧文件（arrow_framed），
#   无需 TCP 注入（daemon 的 sources_dir/send-arrow 路径见 bench.sh）；
# - sinks = "topology/sinks_file"：输出落盘 topology/sinks_file/business.d/benchmark.toml
#   指定的 data/alerts/benchmark.ndjson（blackhole + json_sink 双写）；
# - rules 指向 models/queries/*.wfl（注意：旧文档的 models/rules/*.wfl 不存在）——
#   verify_file.sh 会逐查询替换成单规则文件再跑（多规则同跑存在规则间交互差异，
#   见 verify_file.sh 头注释）。
mode = "batch"
sinks = "topology/sinks_file"
windows = "models/schemas/windows.toml"
work_root = "."

[[sources]]
type = "file"
name = "ingress"
path = "data/bench_1m_v5.frames"
data_format = "arrow_framed"
stream_tag = ""

[runtime]
parse_parallelism = 10
rule_parallelism =  10
rule_exec_timeout = "30s"
parse_buffer_bytes = 2147483648
schemas = "models/schemas/*.wfs"
rules = "models/queries/*.wfl"

[metrics]
enabled = true
report_interval = "100ms"

[logging]
level = "info"
format = "plain"
file = "data/wfusion.log"
