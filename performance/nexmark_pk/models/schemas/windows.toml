[window_defaults]
# 1s：消费感知门控（WindowProgress floor）后时间驱逐只在
# "事件时间过期 && 所有消费者已 ack" 时释放行，tick 变密不丢数据。
evict_interval = "200ms"
# 256MB：无显式配置的窗口字节预算上限（性能定位：8GB 全量驻留是内存带宽墙）。
max_window_bytes = "256MB"
# 2026-08-25：20GB → 8GB（M-13 q13 内存控制）。100M q13 ingest 期
# bid_events 全量驻留（q13a 消费 630k/s < ingest 3M/s → min_acked 保护挡住
# cap 驱逐 + over=30m 时间驱逐未触发）→ 窗口峰值 21.5GB、RSS 20.3GB。全局
# cap 8GB：超限时 evictor 无安全驱逐 → memory_pressure → actor 停 append →
# q13a 追平 → 驱逐恢复（RSS 被限制，代价 = ingest 断续，EPS 受消费速率约束）。
# ⚠ 全局配置：q5/q16/q18 等 stats 大窗口查询也会被背压（变慢），逐个评估。
max_total_bytes = "2GB"
evict_policy = "time_first"
watermark = "1s"
allowed_lateness = "30m"
late_policy = "drop"

[window.person_events]
mode = "local"
max_window_bytes = "2GB"
over_cap = "2d"

[window.auction_events]
mode = "local"
max_window_bytes = "2GB"
over_cap = "2d"

[window.bid_events]
mode = "local"
# 2GB：字节预算不再承担正确性——D4 保留 pin（wp-reactor
# `WindowProgress::register_retention_pin`）已落地：deferred join（q9/q4a）向右窗
# 发布「还需要的最早事件时间」（= 存活挂起实例的 min(lo_ns)），内存驱逐宁可
# 让窗口瞬时超预算，也不丢这些行。
#
# 历史（pin 落地前，字节上限就是正确性旋钮，join 目标读者无 ack 槽位 → 驱逐
# 自由丢行 → 静默少输出）：
#   - 256MB：只够 ~140s bid → q9 10M 引擎 81,974 vs oracle 557,204；
#   - 2GB：10M 的 920 万行（~1.8GB）刚好装下 → evict=0 → 对；但 30M 的 2760 万行
#     需 ~5.4GB → 驱逐 17,180,418 行（62.2%）→ q9/q4a 偏差 −62%。
# 注：`over`（nexmark.wfs = 30m，2026-08-25 评估 gate 落地后从 1h 调小）
# **纯内存参数**：D4 保留 pin 已闭环到时间驱逐（`evict_expired_impl` 与
# `evict_oldest_acked` 同款检查）——deferred join 挂起实例需要的行，over 再小
# 也不会删（2026-08-25：100M q4 over=30m 欠发 6-9k 条 = 评估 gate 前时间驱逐
# 删了区间内 bid，闭环后 over=30m 与 1h 语义完全一致）。30m 只影响内存保留量。
max_window_bytes = "2GB"
over_cap = "2d"

# q4 双规则链中间窗口（q4a deferred reduce → auction_finals → q4b stats avg）；
# nexmark.wfs 定义 over=1h，2026-08-23 双规则链落地时漏配导致全部查询
# validate over vs over_cap 失败。
[window.auction_finals]
mode = "local"
max_window_bytes = "2GB"
over_cap = "2d"

# q13 双规则链中间窗口（q13a on each → bid_mod → q13b snapshot join side_input）
# 2026-08-25：2GB → 512MB（内存控制）。q13b 分片消费快，bid_mod 驻留被
# min_acked（最慢 shard 处理位置）保守 floor 限制，2GB cap 允许了 2GB 已读
# 滞留；512MB 足够（驱逐受未读保护，q13b 追平时窗口本来就小）。
[window.bid_mod]
mode = "local"
max_window_bytes = "512MB"
over_cap = "2d"

# q13 有界侧输入静态表（knowdb CSV 加载 key 0..9999 → value；nexmark.wfs 的
# window<provider> side_input；daemon 从 knowdb.toml 加载 data/side_input/side_input.csv）
[window.side_input]
mode = "local"
table = "side_input"
over_cap = "0s"

# 输出窗口（over=0）
[window.nexmark_alerts]
mode = "local"
max_window_bytes = "16MB"
over_cap = "0s"
