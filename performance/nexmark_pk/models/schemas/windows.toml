[window_defaults]
# 1s：消费感知门控（WindowProgress floor）后时间驱逐只在
# "事件时间过期 && 所有消费者已 ack" 时释放行，tick 变密不丢数据。
evict_interval = "1s"
max_window_bytes = "8GB"
max_total_bytes = "20GB"
evict_policy = "time_first"
watermark = "1s"
allowed_lateness = "30m"
late_policy = "drop"

[window.person_events]
mode = "local"
max_window_bytes = "2GB"
over_cap = "1h"

[window.auction_events]
mode = "local"
max_window_bytes = "2GB"
over_cap = "1h"

[window.bid_events]
mode = "local"
max_window_bytes = "8GB"
over_cap = "1h"

# 输出窗口（over=0）
[window.nexmark_alerts]
mode = "local"
max_window_bytes = "16MB"
over_cap = "0s"
