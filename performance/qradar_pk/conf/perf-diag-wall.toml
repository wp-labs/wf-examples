# 性能墙定位（perf-diag 墙梯）配置 —— diag.sh 专用
#
# 墙梯是**叠加式**（从管线尾部向前切，见 wp-reactor/docs/PERF_BISECTION_METHOD.md §2）：
#   floor = 注入 + 解码 + 窗口 append（净管道，与规则集无关）
#   rules = floor + 450 条规则求值   → 增量 = 规则墙（本 case 的已知主墙）
#   full  = rules + 输出链           → 增量 = 输出墙（blackhole 口径，近无成本）
#
# 档间切换由哨兵（漂流瓶）驱动，单 daemon 不重启；启动即应用 stages[0]。
# 机制见 wp-reactor/docs/design/perf-diag-mode-design.md，用法见
# wp-reactor/docs/user-guide/perf-diag.md。
#
# ⚠ 两条 qradar_pk 特有前提（diag.sh 已自动处理，手工起 daemon 时须自己保证）：
#   1. 必须解除 conf/wfusion.toml 的 max_ingest_rate = 150000——限速会把三档
#      全部封顶在 150k EPS，墙梯彻底失去区分度（README 测量纪律 §3）；
#   2. report_interval 须从 1s 改 100ms——1s 粒度是「26万 vs 970万」测量假象的
#      根源（设计文档 §1.1、§4.5）。哨兵口径本身不受影响，但健康计数器的尾部
#      导出会被 1s 粒度截断。
#
# ⚠ rules 字段留空 = 保持 daemon 当前规则文件（models/rules/*.wfl 全量 450 条）。
#   规则家族档（只跑某前缀子集）由 diag.sh 的 FAMILIES= 生成，不写在本文件。

[[stages]]
name = "floor"
cut_rules = true
cut_output = true
rules = ""

[[stages]]
name = "rules"
cut_rules = false
cut_output = true
rules = ""

[[stages]]
name = "full"
cut_rules = false
cut_output = false
rules = ""
