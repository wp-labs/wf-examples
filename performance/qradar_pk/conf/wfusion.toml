# eps_throughput — 吞吐压测（目标 EPS >= 10000）
# daemon 模式：TCP 全速输入 + 指标监控，测量引擎每秒处理事件数

sources_dir = "topology/sources"
sinks = "topology/sinks"
windows = "models/schemas/windows.toml"

[runtime]
rule_shards = 1
rule_exec_timeout = "30s"
schemas = "models/schemas/*.wfs"
rules = "models/rules/*.wfl"
# 入流限速 = 规则稳态吞吐（~150k）。450 规则是瓶颈，不限速时入流 > 规则
# → 窗口积压涨到 max_window_bytes 后丢数据（#18 门禁失败）；限到规则吞吐后
# 规则追平、窗口时间老化生效（配合 gen_events 300µs/事件，窗口稳态 ~1GB），
# 任意 N 无损可跑。
max_ingest_rate = 150000

[metrics]
enabled = true
report_interval = "1s"

[logging]
level = "info"
format = "plain"
file = "data/wfusion.log"
