# 诊断模式配置（wfusion daemon --perf-diag conf/perf-diag.toml 加载）
#
# 诊断点状态机：sentinel(round=k) emit 后自动应用点 k+1（门控翻转 + 规则 reload），
# 写 perf_point{current=k+1} 切换完成信号。wfgen perf-diag 与 daemon 读同一份。
# 详见 wp-reactor/docs/design/perf-diag-mode-design.md。

diag = true
cut_rules = false        # 初始门控（点 0 前的空闲态）
cut_output = false

# 诊断点列表（墙梯：尾部向前切，叠加式）
#   floor = 管道净段（注入+解码+窗口）   rules = +规则求值   full = +输出链
[[points]]
name = "floor"
cut_rules = true
cut_output = true
rules = ""               # 空 = 保持当前规则文件

[[points]]
name = "rules"
cut_rules = false
cut_output = true
rules = ""

[[points]]
name = "full"
cut_rules = false
cut_output = false
rules = ""
