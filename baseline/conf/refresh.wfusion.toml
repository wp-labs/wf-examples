# S2-M3b refresh 实证（daemon）：baseline_detect 经 provider join 判定。
# knowdb.toml 给 baseline_ref 配 refresh="1s" → daemon 周期重载 CSV。
# 用法: wfusion daemon --config conf/refresh.wfusion.toml --work-dir .
#       见 scripts/run_refresh.sh

sources_dir = "topology/sources"
sinks = "topology/sinks"
windows = "models/schemas/windows.toml"

[runtime]
executor_parallelism = 4
rule_exec_timeout = "30s"
schemas = "models/schemas/*.wfs"
rules = "models/rules/baseline_detect.wfl"

[metrics]
enabled = true
report_interval = "2s"

[logging]
level = "info"
format = "plain"
file = "data/logs/wfusion_refresh.log"
