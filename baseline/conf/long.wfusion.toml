# baseline 长跑（run_long.sh）专用：15s 固定窗，便于在 ~1 分钟内观察多次窗推进。
# 其余与 conf/wfusion.toml 一致（rules 指向 rules-long/）。

sources_dir = "topology/sources"
sinks = "topology/sinks"
windows = "models/schemas/windows.toml"

[runtime]
executor_parallelism = 4
rule_exec_timeout = "30s"
schemas = "models/schemas/*.wfs"
rules = "models/rules-long/*.wfl"

[metrics]
enabled = true
report_interval = "2s"

[logging]
level = "info"
format = "plain"
file = "data/logs/wfusion_long.log"
